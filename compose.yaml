services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evidencedesk}
      POSTGRES_USER: ${POSTGRES_USER:-evidencedesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evidencedesk_local}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-evidencedesk}
      PGUSER: ${POSTGRES_USER:-evidencedesk}
      PGPASSWORD: ${POSTGRES_PASSWORD:-evidencedesk_local}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s
volumes:
  postgres_data:
